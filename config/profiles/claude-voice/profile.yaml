# The cat as a status light you can talk to. Ask it what Claude is doing and it
# answers out loud, so you do not switch windows to find out that nothing has
# changed.
#
# Needs two helpers running on Windows, because that is where Claude Code and
# ccpet write their state. One command starts both, detached:
#
#   .\cat.ps1 watch      start them
#   .\cat.ps1 status     check they are up
#   .\cat.ps1 unwatch    stop them
#
# Without them the cat still talks, it just says it cannot see the sessions.
#
# The cat cannot send anything back into a session. docs/voice-into-claude.md
# explains what that would take.

description: Ask what Claude Code is doing, and watch it on the cat's face.

TTS:
  EdgeTTS:
    # Chinese, because that is the wake word the firmware ships and the language
    # this cat is actually spoken to in. The two lines move together: an English
    # voice reading Chinese text mispronounces every word of it.
    voice: zh-CN-XiaoyiNeural
    language: Chinese

LLM:
  OpenAILLM:
    model_name: gpt-4o-mini

# Two bundled plugins are on in this profile, and only this one: desk-cat
# stays the no-tools fallback. web_search goes through Tavily. play_music
# plays files from the repo's music/ folder, mounted into the container, and
# it only earned its place here once that folder had songs in it. The
# functions list replaces base.yaml's empty one outright.
Intent:
  function_call:
    functions:
      - web_search
      - play_music

plugins:
  web_search:
    provider: tavily
    description: "联网搜索工具。当用户问到新闻、时事、或任何需要最新信息才能回答的问题时使用。"
    max_results: 5
    api_key: ${TAVILY_API_KEY}
