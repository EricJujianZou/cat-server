services:
  cat-server:
    # Built by Dockerfile.slim from the upstream image, with the packages this
    # config never imports deleted. 10.6GB down to 1.31GB, same code, same
    # versions of everything that is left.
    #   docker build -f Dockerfile.slim -t cat-server:slim .
    # To go back to stock, put this tag on the image line instead:
    #   ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    # See docs/slim-image.md.
    image: cat-server:slim
    container_name: cat-server
    restart: unless-stopped
    # Host networking, not a published port map. WSL runs with
    # networkingMode=mirrored so the distro holds the Windows LAN address
    # directly, and Docker's bridge does not survive that. On host networking
    # the server binds 192.168.4.46 itself, which is what the cat dials.
    #
    # Ports it opens:
    #   8000  WebSocket the cat holds open, carrying audio both ways
    #   8003  HTTP, serves the endpoint the cat asks at boot
    #   8004  HTTP, the push bridge added by patches/. Not part of the image.
    network_mode: host
    environment:
      TZ: America/Toronto
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      # Two file overlays that add server push. push_bridge.py is new, and
      # connection.py is the stock file with a two-line hook that calls into it.
      # Remove both lines and the container is stock again. See patches/README.md.
      - ./patches/push_bridge.py:/opt/xiaozhi-esp32-server/core/push_bridge.py:ro
      - ./patches/connection.py:/opt/xiaozhi-esp32-server/core/connection.py:ro
      # MCP servers the profiles can launch. Read only, so the container can run
      # them but nothing in it can rewrite them.
      - ./tools/mcp:/opt/xiaozhi-esp32-server/mcp-tools:ro
